name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, build and leak check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The leak check greps the whole history, not just the tip — a secret
          # removed in a later commit is still published.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Verified community nodes may not carry runtime dependencies at all.
      # Catching that here is cheaper than finding out at submission.
      - name: No runtime dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const deps = Object.keys(p.dependencies || {});
            if (deps.length) {
              console.error('Runtime dependencies are not allowed for verified nodes:', deps);
              process.exit(1);
            }
            console.log('No runtime dependencies.');
          "

      # This package is public. Everything below has leaked out of somebody's
      # repository at some point; the patterns are cheap and the consequence of
      # missing one is permanent.
      - name: No secrets or internal infrastructure
        run: |
          set -eu

          patterns='(kbc_|kbw_|kbi_)[A-Za-z0-9]{12,}|sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|glpat-[A-Za-z0-9_-]{10,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|cloud-workstation|k3s-[a-z0-9-]+|\.internal\b|(^|[^0-9.])10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}'

          # Two exclusions, both load-bearing:
          #
          # package-lock.json is generated, legitimately full of long opaque
          # integrity hashes, and not somewhere a secret hides without also
          # being somewhere else.
          #
          # This file excludes itself because the pattern list above IS a list
          # of the strings being searched for — without this the check finds
          # its own definition and fails every run, which is the fastest way to
          # teach a team to ignore it.
          if git grep -nIE "$patterns" $(git rev-list --all) \
               -- ':!package-lock.json' ':!.github/workflows/ci.yml' > /tmp/leaks.txt 2>/dev/null; then
            echo "Possible secret or internal hostname found in the history:"
            cat /tmp/leaks.txt
            exit 1
          fi

          echo "No secrets or internal hostnames found."
